# gradle-plugin is a separate included build (composite build), which does NOT
# inherit the root project's gradle.properties -- without this, it fell back to
# Gradle's own JDK auto-detection, which unreliably picks some other JDK on this
# machine instead of the pinned JDK 17 below.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21
org.gradle.java.installations.auto-download=false
