org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# JDK 21, not 17: idea-plugin needs a JDK21-capable compiler (the
# intellij-platform-gradle-plugin forces its compileKotlin target to 21, matching
# Android Studio's own minRequiredJavaVersion), and a JDK21 compiler can still target
# 17 for every other module (backward direction, fully supported) -- see each
# module's own sourceCompatibility/targetCompatibility for its actual target.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21
# Toolchain auto-detection on this machine has repeatedly proven unreliable (see
# idea-plugin/build.gradle.kts for the full story) -- force everything onto the
# pinned JDK above instead of letting Gradle silently discover/fetch a different one.
org.gradle.java.installations.auto-download=false
# AGP 9 defaults to its own built-in Kotlin support and a new DSL, both incompatible
# with the org.jetbrains.kotlin.android plugin our modules still apply. Opt out of
# both for now to avoid bundling a DSL migration into the AGP 9 upgrade.
android.builtInKotlin=false
android.newDsl=false
